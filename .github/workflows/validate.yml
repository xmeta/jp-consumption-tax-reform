name: validate
on:
  push:
  pull_request:

jobs:
  scientific-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: |
          python -m pip install -r requirements-research-lp.txt
          python -m pip install -r requirements-data-extraction.txt

      - name: Rebuild official-source catalogs and e-Stat extracts
        run: |
          python scripts/build_source_catalog.py
          python scripts/extract_estat_income_tax_tables.py
          python scripts/test_estat_income_tax_extracts.py
          python scripts/build_income_tax_decile_instruments.py
          python scripts/extract_estat_f71911_bridge.py
          python scripts/test_estat_f71911_bridge.py
          python scripts/extract_estat_rank_bridge_diagnostics.py
          python scripts/test_estat_rank_bridge_diagnostics.py
          python scripts/build_income_tax_2026_statutory_parameters.py
          python scripts/test_income_tax_2026_statutory_parameters.py
          python scripts/extract_nta_table17_and_f71551.py
          python scripts/test_nta_table17_and_f71551.py
          python scripts/extract_nta_stage2_holdout.py
          python scripts/test_nta_stage2_holdout.py
          python scripts/extract_nta_shinkoku_income_class_primary_type.py
          python scripts/test_nta_shinkoku_income_class_primary_type.py
          python scripts/extract_nta_positive_balance_tax_flow.py
          python scripts/test_nta_positive_balance_tax_flow.py
          python scripts/extract_nta_calculated_tax_denominator_audit.py
          python scripts/test_nta_calculated_tax_denominator_audit.py
          python scripts/extract_nta_private_salary_taxpayer_status.py
          python scripts/test_nta_private_salary_taxpayer_status.py
          python scripts/extract_nta_annual_income_class_filing_status.py
          python scripts/test_nta_annual_income_class_filing_status.py
          python scripts/extract_nta_salary_return_overlap.py
          python scripts/test_nta_salary_return_overlap.py
          python scripts/extract_nta_salary_receipt_return_bridge.py
          python scripts/test_nta_salary_receipt_return_bridge.py
          python research/income_tax_pseudofiler/run_pseudofiler_core.py
          python research/income_tax_pseudofiler/test_pseudofiler_core.py
          python research/income_tax_partial_identification/run_replacement_transport_lp.py
          python research/income_tax_partial_identification/test_replacement_transport_lp.py
          python research/income_tax_partial_identification/run_rank_bridge_lp_v2.py
          python research/income_tax_partial_identification/test_rank_bridge_lp_v2.py
          python research/income_tax_partial_identification/run_rank_bridge_lp_v3.py
          python research/income_tax_partial_identification/test_rank_bridge_lp_v3.py
          python research/income_tax_partial_identification/run_rank_epsilon_surface_v4.py
          python research/income_tax_partial_identification/test_rank_epsilon_surface_v4.py
          python research/income_tax_partial_identification/test_self_assessed_balance_schema_migration.py
          python research/income_tax_partial_identification/test_rank_one_sided_bridge_v5_prespec.py
          python research/income_tax_partial_identification/run_rank_one_sided_bridge_v5.py
          python research/income_tax_partial_identification/test_rank_one_sided_bridge_v5.py
          python scripts/build_derived_catalog.py
          python scripts/build_input_provenance.py
          python scripts/build_stage1_inputs.py

      - name: Validate source, derived-data, input and claim provenance
        run: |
          python scripts/validate_provenance.py

      - name: Reproduce stage-1 frontiers
        run: |
          python research/stage1_filing_bound/46_income_tax_stage1_population_overlap.py
          python research/stage1_filing_bound/47_income_tax_stage1_contamination_frontier.py
          python research/stage1_filing_bound/48_income_tax_stage1_untracked_frontier.py
          python research/stage1_filing_bound/49_income_tax_stage1_frontier_grid.py
          python research/stage1_filing_bound/test_stage1_population_overlap.py
          python research/stage1_filing_bound/test_stage1_contamination_frontier.py
          python research/stage1_filing_bound/test_stage1_untracked_frontier.py
          python research/stage1_filing_bound/test_stage1_frontier_grid.py

      - name: Validate Paper 1 claims
        run: |
          python paper1/scripts/generate_stage1_attributes.py --check
          python paper1/scripts/generate_frontier_table.py --check
          python paper1/scripts/generate_transport_lp_table.py --check
          python paper1/scripts/generate_rank_bridge_v2_table.py --check
          python paper1/scripts/generate_rank_bridge_v3_table.py --check
          python paper1/scripts/generate_rank_epsilon_v4_table.py --check
          python paper1/scripts/generate_rank_one_sided_v5_table.py --check
          python paper1/scripts/validate_claim_registry.py

      - name: Validate repository integrity
        run: |
          python scripts/validate_repo.py
          python scripts/check_manifest.py
          git diff --exit-code

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build Paper 1
        run: |
          gem install asciidoctor --no-document
          asciidoctor -o /tmp/paper1.html paper1/index.adoc
