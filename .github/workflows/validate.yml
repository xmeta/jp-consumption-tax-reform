name: validate
on:
  push:
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reproduce source integrity
        run: python scripts/reproduce.py source-integrity

  vat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-research-lp.txt
            requirements-data-extraction.txt
      - name: Install pinned research dependencies
        run: |
          python -m pip install -r requirements-research-lp.txt
          python -m pip install -r requirements-data-extraction.txt
      - name: Reproduce VAT research
        run: python scripts/reproduce.py vat

  income-tax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-research-lp.txt
            requirements-data-extraction.txt
      - name: Install pinned research dependencies
        run: |
          python -m pip install -r requirements-research-lp.txt
          python -m pip install -r requirements-data-extraction.txt
      - name: Reproduce income-tax research
        run: python scripts/reproduce.py income-tax

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reproduce and validate provenance
        run: python scripts/reproduce.py provenance

  paper1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reproduce Paper 1
        run: python scripts/reproduce.py paper1

  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test machine-readable scientific state
        run: python scripts/test_scientific_state.py
      - name: Validate repository integrity
        run: python scripts/reproduce.py integrity

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Asciidoctor
        run: gem install asciidoctor --no-document
      - name: Build documentation
        run: python scripts/reproduce.py docs

  full-reproduction:
    needs:
      - source-integrity
      - vat
      - income-tax
      - provenance
      - paper1
      - repository-integrity
      - docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-research-lp.txt
            requirements-data-extraction.txt
      - name: Install pinned research dependencies
        run: |
          python -m pip install -r requirements-research-lp.txt
          python -m pip install -r requirements-data-extraction.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Asciidoctor
        run: gem install asciidoctor --no-document
      - name: Clean-room full reproduction
        run: python scripts/reproduce.py clean-room
