name: issue56-retry

on:
  push:
    branches:
      - research/issue-56-dynamic-fiscal-jgb

permissions:
  contents: write

jobs:
  retry:
    if: github.event.head_commit.message == 'Patch Issue 56 integration retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch canonical stop-rule enum and retrigger integration
        run: |
          sed -i 's/STOP_DESCRIPTIVE_ACCUMULATION/STOP_UNLINKED_EVIDENCE_ACCUMULATION/' .github/workflows/issue56-integrate.yml
          rm .github/workflows/issue56-retry.yml
          git config user.name xmeta
          git config user.email xmeta@users.noreply.github.com
          git add -A
          git commit -m 'Run Issue 56 integration'
          git push origin HEAD:research/issue-56-dynamic-fiscal-jgb
