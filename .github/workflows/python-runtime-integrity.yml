name: python-runtime-integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  optimized-python-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify runtime scientific guards
        run: python scripts/test_python_optimized_runtime_guards.py
