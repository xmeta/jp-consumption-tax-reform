name: issue56-dynamic-fiscal

on:
  push:
    branches:
      - research/issue-56-dynamic-fiscal-jgb

permissions:
  contents: read

jobs:
  dynamic-fiscal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Regenerate dynamic fiscal artifacts
        run: python research/vat_policy_integration/build_dynamic_fiscal_jgb_paths.py
      - name: Verify committed artifacts and stock-flow identities
        run: python research/vat_policy_integration/test_dynamic_fiscal_jgb_paths.py
      - name: Ensure generator is deterministic
        run: git diff --exit-code -- data/derived/vat_dynamic_fiscal_paths.csv data/derived/vat_dynamic_fiscal_summary.csv
