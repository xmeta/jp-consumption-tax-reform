name: issue60-transform

on:
  push:
    branches: [fix/optimized-python-assert-guards]

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Transform runtime asserts and guard executable tests
        run: |
          python scripts/_issue60_transform.py
          git rm scripts/_issue60_transform.py
          python scripts/test_python_optimized_runtime_guards.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace optimized-away scientific runtime asserts"
      - name: Rebase onto connector-side workflow cleanup
        run: |
          sleep 20
          git pull --rebase origin fix/optimized-python-assert-guards
      - name: Regenerate integrity manifest and verify
        run: |
          python scripts/generate_manifest.py
          git add MANIFEST.sha256
          git commit --amend --no-edit
          python scripts/test_python_optimized_runtime_guards.py
          python scripts/validate_provenance.py
          python scripts/validate_repo.py
          python scripts/check_manifest.py
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Push transformed branch
        run: git push origin HEAD:fix/optimized-python-assert-guards
