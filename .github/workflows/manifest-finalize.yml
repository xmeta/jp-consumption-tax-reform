name: manifest-finalize

on:
  push:
    branches:
      - fix/provenance-duplicate-primary-keys

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Regenerate manifest without bootstrap workflow
        run: |
          git rm --cached .github/workflows/manifest-finalize.yml
          python scripts/generate_manifest.py
          grep -F '  .github/workflows/provenance-keys.yml' MANIFEST.sha256
          grep -F '  data/REGISTRY_KEYS.adoc' MANIFEST.sha256
          grep -F '  scripts/test_validate_provenance_duplicate_keys.py' MANIFEST.sha256
          if grep -Fq '  .github/workflows/manifest-finalize.yml' MANIFEST.sha256; then
            echo 'temporary workflow leaked into manifest' >&2
            exit 1
          fi
          python scripts/check_manifest.py
      - name: Commit manifest only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256
          git commit MANIFEST.sha256 -m "Refresh manifest for provenance key validation"
          git push origin HEAD:fix/provenance-duplicate-primary-keys
