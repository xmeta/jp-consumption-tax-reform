name: issue63-bootstrap

on:
  push:
    branches:
      - fix/provenance-duplicate-primary-keys

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply narrow duplicate-key fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate_provenance.py")
          text = path.read_text(encoding="utf-8")

          old_recovery = '''recovery_rows = read_csv("data/recovery/v6_recovered_values.csv")
          recovery = {r["value_id"]: r for r in recovery_rows}
          '''
          new_recovery = '''recovery_rows = read_csv("data/recovery/v6_recovered_values.csv")
          # Primary key: value_id. Reject duplicates before dictionary construction.
          recovery = {}
          for r in recovery_rows:
              vid = r["value_id"]
              if vid in recovery:
                  errors.append(f"duplicate recovery value_id: {vid}")
                  continue
              recovery[vid] = r
          '''

          old_claims = '''claims_rows = read_csv("paper1/data/claim_registry.csv")
          claims = {r["claim_id"]: r for r in claims_rows}
          '''
          new_claims = '''claims_rows = read_csv("paper1/data/claim_registry.csv")
          # Primary key: claim_id. Keep provenance validation fail-closed even though
          # the Paper 1 claim validator independently checks this key as well.
          claims = {}
          for r in claims_rows:
              cid = r["claim_id"]
              if cid in claims:
                  errors.append(f"duplicate claim_id: {cid}")
                  continue
              claims[cid] = r
          '''

          if text.count(old_recovery) != 1:
              raise SystemExit("unexpected recovery block; refusing broad edit")
          if text.count(old_claims) != 1:
              raise SystemExit("unexpected claim block; refusing broad edit")

          text = text.replace(old_recovery, new_recovery)
          text = text.replace(old_claims, new_claims)
          path.write_text(text, encoding="utf-8")
          PY

          # This workflow is bootstrap-only and must not survive into the PR payload.
          rm .github/workflows/issue63-bootstrap.yml
          git diff --check

      - name: Verify valid repository baseline
        run: python scripts/validate_provenance.py

      - name: Verify duplicate recovery value_id fails
        run: |
          cp data/recovery/v6_recovered_values.csv /tmp/recovery.csv
          python - <<'PY'
          from pathlib import Path
          p = Path("data/recovery/v6_recovered_values.csv")
          lines = p.read_text(encoding="utf-8").splitlines()
          lines.append(lines[1])
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          set +e
          output=$(python scripts/validate_provenance.py 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          printf '%s\n' "$output" | grep -F "duplicate recovery value_id:"
          mv /tmp/recovery.csv data/recovery/v6_recovered_values.csv

      - name: Verify duplicate claim_id fails in provenance validator
        run: |
          cp paper1/data/claim_registry.csv /tmp/claim_registry.csv
          python - <<'PY'
          from pathlib import Path
          p = Path("paper1/data/claim_registry.csv")
          lines = p.read_text(encoding="utf-8").splitlines()
          lines.append(lines[1])
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          set +e
          output=$(python scripts/validate_provenance.py 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          printf '%s\n' "$output" | grep -F "duplicate claim_id:"
          mv /tmp/claim_registry.csv paper1/data/claim_registry.csv

      - name: Regenerate and verify final manifest
        run: |
          python scripts/generate_manifest.py
          python scripts/check_manifest.py
          python scripts/validate_provenance.py
          python scripts/validate_repo.py
          git diff --check

      - name: Commit final branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject duplicate provenance primary keys"
          python scripts/check_clean_tree.py
          git push origin HEAD:fix/provenance-duplicate-primary-keys
