name: issue43-finalize
on:
  push:
    branches:
      - feature/issue-43-semantic-state-validation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/issue-43-semantic-state-validation
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify semantic scientific-state gate
        run: |
          python -m py_compile scripts/validate_scientific_state.py scripts/validate_repo.py scripts/test_scientific_semantics.py
          python scripts/test_scientific_state.py
          python scripts/test_scientific_semantics.py
          python scripts/validate_scientific_state.py
          python scripts/validate_repo.py
      - name: Finalize manifest and remove temporary workflow
        run: |
          git rm .github/workflows/issue43-finalize.yml
          python scripts/generate_manifest.py
          python scripts/check_manifest.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize semantic scientific-state validation"
          git push origin HEAD:feature/issue-43-semantic-state-validation
