name: issue56-integrate

on:
  push:
    branches:
      - research/issue-56-dynamic-fiscal-jgb

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run Issue 56 integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Integrate dynamic fiscal module
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'scripts/reproduce.py',
              '    ("research/vat_policy_integration/build_jgb_debt_gdp_reference.py",),\n    ("research/vat_policy_integration/test_jgb_debt_gdp_reference.py",),\n',
              '    ("research/vat_policy_integration/build_jgb_debt_gdp_reference.py",),\n    ("research/vat_policy_integration/test_jgb_debt_gdp_reference.py",),\n    ("research/vat_policy_integration/build_dynamic_fiscal_jgb_paths.py",),\n    ("research/vat_policy_integration/test_dynamic_fiscal_jgb_paths.py",),\n',
          )

          catalog_marker = '    (\n        "VAT-POLICY-SCENARIO-MATRIX",\n'
          catalog_insert = '''    (
              "VAT-DYNAMIC-FISCAL-PATHS",
              "vat_dynamic_fiscal_paths.csv",
              "research/vat_policy_integration/build_dynamic_fiscal_jgb_paths.py",
              "ESRI-SNA-2024-NOMINAL-GDP-FISCAL-YEAR;MOF-FY2024-TREASURY-REVENUE-2025-07",
              "MODEL_CONTINGENT_INCREMENTAL_FISCAL_PATH",
              "Twenty decision-relevant 10-year stock-flow rows for full-JGB and 50-percent-JGB mixed financing under the committed 2-percent interest / 2-percent nominal-GDP central sensitivity; incremental policy debt only, not total government debt or a market forecast",
          ),
          (
              "VAT-DYNAMIC-FISCAL-SUMMARY",
              "vat_dynamic_fiscal_summary.csv",
              "research/vat_policy_integration/build_dynamic_fiscal_jgb_paths.py",
              "ESRI-SNA-2024-NOMINAL-GDP-FISCAL-YEAR;MOF-FY2024-TREASURY-REVENUE-2025-07",
              "MODEL_CONTINGENT_INCREMENTAL_FISCAL_SENSITIVITY_ENVELOPE",
              "Eight-scenario summary over nine exogenous interest-rate x nominal-GDP-growth sensitivities; year-10 full-JGB incremental debt/GDP is 27.53--46.76 percent and 50-percent-JGB mixed financing is 13.76--23.38 percent; full replacement zero-debt cases are conditional and no total-debt or endogenous-rate forecast is claimed",
          ),
          ''' + catalog_marker
          replace_once('scripts/build_derived_catalog.py', catalog_marker, catalog_insert)

          replace_once(
              'research/vat_policy_integration/run_vat_policy_scenario_matrix.py',
              'JGB_GDP = ROOT / "data/derived/vat_jgb_debt_gdp_reference.csv"\n',
              'JGB_GDP = ROOT / "data/derived/vat_jgb_debt_gdp_reference.csv"\nDYNAMIC_FISCAL = ROOT / "data/derived/vat_dynamic_fiscal_summary.csv"\n',
          )
          replace_once(
              'research/vat_policy_integration/run_vat_policy_scenario_matrix.py',
              '    jgb_gdp = {r["scenario_id"]: r for r in read(JGB_GDP)}\n',
              '    jgb_gdp = {r["scenario_id"]: r for r in read(JGB_GDP)}\n    dynamic_fiscal = {r["scenario_id"]: r for r in read(DYNAMIC_FISCAL)}\n',
          )
          replace_once(
              'research/vat_policy_integration/run_vat_policy_scenario_matrix.py',
              "    if not (set(jgb_gdp) == EXPECTED_SCENARIOS):\n        raise RuntimeError('scientific runtime invariant failed: research/vat_policy_integration/run_vat_policy_scenario_matrix.py:60')\n",
              "    if not (set(jgb_gdp) == EXPECTED_SCENARIOS):\n        raise RuntimeError('scientific runtime invariant failed: research/vat_policy_integration/run_vat_policy_scenario_matrix.py:60')\n    if set(dynamic_fiscal) != EXPECTED_SCENARIOS:\n        raise RuntimeError('unexpected dynamic fiscal scenario set')\n",
          )
          replace_once(
              'research/vat_policy_integration/run_vat_policy_scenario_matrix.py',
              '        first = rr[0]\n        summary.append({\n',
              '        first = rr[0]\n        dynamic = dynamic_fiscal[scenario["scenario_id"]]\n        summary.append({\n',
          )
          replace_once(
              'research/vat_policy_integration/run_vat_policy_scenario_matrix.py',
              '            "debt_gdp_reference_status": first["debt_gdp_reference_status"],\n            "overall_real_gdp_status": first["overall_real_gdp_level_effect_status"],\n',
              '            "debt_gdp_reference_status": first["debt_gdp_reference_status"],\n            "dynamic_fiscal_status": dynamic["dynamic_fiscal_status"],\n            "dynamic_fiscal_modeled_assumption_sets": dynamic["modeled_assumption_sets"],\n            "dynamic_fiscal_reported_path_assumption_set_id": dynamic["reported_path_assumption_set_id"],\n            "dynamic_fiscal_horizon_years": dynamic["horizon_years"],\n            "year10_incremental_debt_gdp_ratio_min": dynamic["year10_incremental_debt_gdp_ratio_min"],\n            "year10_incremental_debt_gdp_ratio_max": dynamic["year10_incremental_debt_gdp_ratio_max"],\n            "year10_cumulative_incremental_interest_yen_min": dynamic["year10_cumulative_incremental_interest_yen_min"],\n            "year10_cumulative_incremental_interest_yen_max": dynamic["year10_cumulative_incremental_interest_yen_max"],\n            "dynamic_fiscal_identification_status": dynamic["identification_status"],\n            "overall_real_gdp_status": first["overall_real_gdp_level_effect_status"],\n',
          )

          test_anchor = 'assert summary["full_abolition_jgb"]["debt_gdp_status"] == "STATIC_JGB_AMOUNT_REFERENCE_AVAILABLE_DEBT_GDP_AND_DYNAMIC_PATH_NOT_MODELED"\n'
          test_insert = test_anchor + '''assert summary["full_abolition_jgb"]["dynamic_fiscal_status"] == "MODEL_CONTINGENT_INCREMENTAL_DEBT_PATH_SENSITIVITY"
          assert summary["full_abolition_jgb"]["dynamic_fiscal_modeled_assumption_sets"] == "9"
          assert summary["full_abolition_jgb"]["dynamic_fiscal_reported_path_assumption_set_id"] == "r02_g02"
          assert summary["full_abolition_jgb"]["year10_incremental_debt_gdp_ratio_min"] == "0.275285239955"
          assert summary["full_abolition_jgb"]["year10_incremental_debt_gdp_ratio_max"] == "0.467622064324"
          assert summary["full_abolition_mixed"]["year10_incremental_debt_gdp_ratio_min"] == "0.137642619977"
          assert summary["full_abolition_mixed"]["year10_incremental_debt_gdp_ratio_max"] == "0.233811032162"
          for sid in ("full_abolition_income_tax", "full_abolition_asset_tax"):
              assert summary[sid]["year10_incremental_debt_gdp_ratio_min"] == "0"
              assert summary[sid]["year10_incremental_debt_gdp_ratio_max"] == "0"
          for sid in ("reduced_5", "zero_rate_admin_retained", "full_abolition"):
              assert summary[sid]["year10_incremental_debt_gdp_ratio_min"] == ""
              assert summary[sid]["dynamic_fiscal_identification_status"] == "NOT_MODELED"
          '''
          replace_once('research/vat_policy_integration/test_vat_policy_scenario_matrix.py', test_anchor, test_insert)

          readme_anchor = '''financial assets, nominal-GDP feedback, interest costs and time dynamics are not
          modeled.

          On the household side,'''
          readme_insert = '''financial assets, nominal-GDP feedback, interest costs and time dynamics are not
          modeled by that static benchmark.

          == Dynamic incremental fiscal/JGB accounting

          Issue #56 adds a separate stock-flow-consistent *incremental policy-debt*
          sensitivity module.  It does not reconstruct or forecast Japan's total government
          debt stock.  The opening incremental debt is zero and the FY2024 central VAT cash-
          receipt reference of 25.021206715 trillion yen is repeated as a constant nominal
          annual gap only for the financing sensitivity.  The accounting identity is

          [stem]
          ++++
          D_t = D_{t-1} - R_t + I_t^{gross},\qquad
          I_t^{gross}=R_t+G_t+iD_{t-1}+\Delta A_t,
          ++++

          where stem:[G_t] is the policy primary gap financed with JGBs, stem:[R_t]
          redemptions, stem:[i] the exogenous effective interest-rate sensitivity and
          stem:[\Delta A_t] the financial-asset change (fixed at zero in this first model).
          Redemptions are shown explicitly and refinanced, so they affect gross issuance but
          do not by themselves change net incremental debt.

          The committed sensitivity grid crosses effective interest rates of 1%, 2% and 4%
          with nominal-GDP growth of 0%, 2% and 4%, uses a 20% annual redemption/refinancing
          rate, a ten-year horizon, and a 50% primary JGB share for the mixed-financing case.
          These are versioned *model sensitivities, not empirical bounds*.  The stored annual
          paths use the central +r02_g02+ case; the summary reports extrema over all nine
          rate-growth combinations.

          Under those accounting assumptions, year-10 incremental debt/GDP is 27.53--46.76%
          for full JGB financing and 13.76--23.38% for the 50%-JGB mixed case. Income-tax and
          asset-tax replacement show zero incremental policy debt only *conditional on full
          replacement of the static target*.  The results are not total government debt/GDP,
          fiscal-sustainability estimates, interest-rate forecasts, or endogenous JGB-market
          responses.  VAT demand and institutional productivity effects are not inserted into
          nominal GDP here, which prevents double counting with the separate policy modules.

          On the household side,'''
          replace_once('research/vat_policy_integration/README.adoc', readme_anchor, readme_insert)

          def rewrite_csv(path, mutate):
              p = Path(path)
              with p.open(encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f)
                  rows = list(reader)
                  fields = reader.fieldnames
              rows = mutate(rows)
              with p.open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader(); w.writerows(rows)

          def claim_evidence(rows):
              if any(r['claim_id'] == 'VAT-C02' and r['evidence_status'] == 'ACTIVE_REPRODUCED_MODEL_CONTINGENT_DYNAMIC_FISCAL' for r in rows):
                  raise SystemExit('dynamic fiscal claim evidence already exists')
              rows.append({
                  'claim_id': 'VAT-C02',
                  'evidence_status': 'ACTIVE_REPRODUCED_MODEL_CONTINGENT_DYNAMIC_FISCAL',
                  'evidence_artifact': 'data/derived/vat_dynamic_fiscal_summary.csv',
                  'source_ids': 'ESRI-SNA-2024-NOMINAL-GDP-FISCAL-YEAR;MOF-FY2024-TREASURY-REVENUE-2025-07',
                  'value_ids': '',
                  'locator': '8 scenarios; 9 exogenous interest-rate x nominal-GDP-growth sensitivities; 10-year incremental policy-debt accounting',
                  'note': 'Supports explicit incremental financing-path sensitivity only; static 3.894868333% benchmark is preserved, while total government debt/GDP, endogenous interest-rate response and fiscal sustainability remain unidentified.',
              })
              return rows
          rewrite_csv('data/claim_evidence.csv', claim_evidence)

          def claim_graph(rows):
              hit = [r for r in rows if r['product_id'] == 'vat_abolition' and r['claim_id'] == 'VAT-C02']
              if len(hit) != 1:
                  raise SystemExit('VAT-C02 claim graph row mismatch')
              r = hit[0]
              r['evidence_scope'] = 'Eight-scenario integration with model-contingent institutional ranges, static fiscal/household accounting references, a separate incremental fiscal/JGB stock-flow sensitivity, Japan historical pass-through/quantity evidence, external temporary-cut transport diagnostics, and an annual-income-decile survey-category VAT rate-scope proxy'
              r['allowed_claim'] = 'The matrix is operational; a separate model-contingent incremental-debt module reports JGB/mixed financing paths and nine rate-growth sensitivities while preserving the static benchmark. Total government debt/GDP, endogenous market response, Japan policy pass-through, transaction-level VAT base, and objective-rank distribution outcomes remain unidentified.'
              r['forbidden_claim'] = 'The matrix is a policy forecast, fiscal-sustainability proof, total-government-debt or interest-rate forecast, joint welfare optimum, identified pass-through coefficient/bound for a Japan VAT cut/abolition, identified Gini or FGT2 effect, or causal VAT demand effect.'
              ids = r['evidence_ids'].split(';') if r['evidence_ids'] else []
              if 'data/derived/vat_dynamic_fiscal_summary.csv' not in ids:
                  ids.append('data/derived/vat_dynamic_fiscal_summary.csv')
              r['evidence_ids'] = ';'.join(ids)
              return rows
          rewrite_csv('data/claim_graph.csv', claim_graph)

          def scientific_state(rows):
              hit = [r for r in rows if r['component_id'] == 'vat_policy_integration']
              if len(hit) != 1:
                  raise SystemExit('vat_policy_integration scientific-state row mismatch')
              r = hit[0]
              for field, value in (
                  ('evidence_paths', 'data/derived/vat_dynamic_fiscal_summary.csv'),
                  ('output_paths', 'data/derived/vat_dynamic_fiscal_paths.csv'),
                  ('output_paths', 'data/derived/vat_dynamic_fiscal_summary.csv'),
              ):
                  parts = r[field].split(';') if r[field] else []
                  if value not in parts:
                      parts.append(value)
                  r[field] = ';'.join(parts)
              r['blockers'] = 'Japan policy pass-through for rate cuts/abolition not identified after bounded external transport audit;transaction-level decile VAT-base shares not identified despite survey-category proxy;objective-rank household incidence not identified;total government debt/GDP level not modeled;endogenous interest-rate/JGB-market response not identified;replacement-tax macro feedback not identified'
              return rows
          rewrite_csv('data/scientific_state.csv', scientific_state)

          def backlog(rows):
              hit = [r for r in rows if r['gap_id'] == 'VAT-DYNAMIC-FISCAL-JGB']
              if len(hit) != 1:
                  raise SystemExit('dynamic fiscal backlog row mismatch')
              r = hit[0]
              r['current_scientific_status'] = 'MODEL_CONTINGENT_INCREMENTAL_STOCK_FLOW_PATH_REPRODUCED; total-debt and market feedback remain NOT_IDENTIFIED'
              r['current_admissible_set'] = 'full-JGB year10 incremental debt/GDP 0.275285239955..0.467622064324; mixed 0.137642619977..0.233811032162 over committed 1/2/4% interest x 0/2/4% nominal-GDP sensitivities; income/asset zero-debt paths conditional on full replacement; not a total-debt forecast'
              r['public_data_search_status'] = 'STOP_DESCRIPTIVE_ACCUMULATION'
              r['stop_rule'] = 'Do not collect additional descriptive fiscal series unless they identify the total-debt baseline mapping or an endogenous interest/GDP/JGB-market response that can change the decision-relevant admissible set.'
              r['escalation_if_stopped'] = 'Keep unsupported rate/GDP/market responses as explicit sensitivities; pursue new data only when it can shrink those sets rather than add descriptive context.'
              r['evidence_accumulation_only'] = 'false'
              r['next_action'] = 'Issue #56 model build complete; reassess remaining M2 blockers against #26/#48 before additional fiscal data collection.'
              return rows
          rewrite_csv('data/research_priority_backlog.csv', backlog)

          Path('.github/workflows/issue56-dynamic-fiscal.yml').unlink(missing_ok=True)
          Path('.github/workflows/issue56-integrate.yml').unlink(missing_ok=True)
          PY

          python research/vat_policy_integration/build_dynamic_fiscal_jgb_paths.py
          python research/vat_policy_integration/test_dynamic_fiscal_jgb_paths.py
          python research/vat_policy_integration/run_vat_policy_scenario_matrix.py
          python research/vat_policy_integration/test_vat_policy_scenario_matrix.py
          python scripts/build_derived_catalog.py
          python scripts/generate_claim_registries.py
          python scripts/generate_claim_registries.py --check
          python scripts/test_research_priority.py
          python scripts/validate_provenance.py
          python scripts/validate_repo.py
          python scripts/test_claim_graph.py
          python scripts/validate_claim_graph.py
          python scripts/generate_manifest.py
          python scripts/check_manifest.py
          git diff --check
      - name: Commit integrated Issue 56 slice
        run: |
          git config user.name xmeta
          git config user.email xmeta@users.noreply.github.com
          git add -A
          git commit -m '[issue56-bot] Integrate dynamic fiscal JGB module'
          git push origin HEAD:research/issue-56-dynamic-fiscal-jgb
